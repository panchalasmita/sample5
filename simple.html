<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, world!</h1>
    <p>This is a simple HTML example with a styled card layout.</p>
    <button onclick="alert('You clicked the button!')">Click me</button>
  </div>
</body>
</html>
